[package]
name = "sdlc-todo"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
resolver = "3"
description = "Tray app for the sdlc-kit personal to-do: a badge, notifications, replies, approvals and agent fixes"
license = "MIT"
publish = false

[dependencies]
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
tray-icon = "0.20"
notify-rust = "4"
ureq = { version = "2", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ttf-parser = { version = "=0.25.1", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
# Already in the tree through winit; runs badge updates on the main thread while the window is hidden.
dispatch = "0.2"
# The board window: the web board in WKWebView (see src/board.rs). objc2 0.6 and objc2-app-kit 0.3 are already in the
# tree through tray-icon; wry uses the same versions.
wry = { version = "0.55", default-features = false }
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSGeometry", "NSNotification", "NSObject", "NSArray", "NSEnumerator"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "objc2-core-foundation", "NSApplication", "NSResponder", "NSWindow", "NSView", "NSScreen", "NSGraphics", "NSMenu", "NSMenuItem", "NSEvent", "NSRunningApplication", "libc"] }
objc2-web-kit = { version = "0.3", default-features = false, features = ["std", "WKWebView", "WKWebViewConfiguration"] }
raw-window-handle = "0.6"
# Maps the sealed system font instead of copying it (see src/theme.rs); in the lock file already, through winit on Linux.
memmap2 = "=0.9.12"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
