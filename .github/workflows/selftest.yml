name: selftest
on:
  # branch work is tested once, on its PR; push covers the delivery targets
  # (main and version tags) that no PR run precedes
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
env:
  # Git Bash otherwise COPIES on `ln -s`, which would make the symlink gate
  # fixtures pass for the wrong reason; ignored on macOS/Linux
  MSYS: winsymlinks:nativestrict
jobs:
  selftest:
    strategy:
      fail-fast: false
      matrix:
        # windows runs under Git Bash — the documented first-class Windows target
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # the fixtures commit, so every runner needs an identity of its own
      - name: git identity for the throwaway fixtures
        run: |
          git config --global user.email ci@sdlc-kit.invalid
          git config --global user.name "sdlc-kit CI"
          # fixture repos must record symlinks as links, not as their contents
          git config --global core.symlinks true
          # Fixtures write LF bytes; do not convert their committed snapshots.
          git config --global core.autocrlf false
        shell: bash
      # tools/verify.sh bounds each command and kills whole process groups
      # through tools/_run.py; every GitHub runner image ships python3, and the
      # automation suite asserts that path. Fail loudly if one ever does not.
      - name: python3 is available (tools/verify.sh bounded execution)
        run: python3 -c "import sys; print(sys.version)"
        shell: bash
      - name: selftest (gate mechanics)
        run: bash gates/selftest.sh
        shell: bash
      - name: e2e (the loop end to end, local fixtures only)
        run: bash gates/e2e.sh
        shell: bash
      - name: autotest (the automation layer, local fixtures only)
        run: bash gates/autotest.sh
        shell: bash
      # the record store: where it lives, how it refuses, how it is read back.
      # It exits 2 when the filesystem cannot create symlinks — on Windows that
      # would be the MSYS setting above failing, which CI must not hide.
      - name: knowledge (record store and retrieval, local fixtures only)
        run: bash gates/knowledge-test.sh
        shell: bash
