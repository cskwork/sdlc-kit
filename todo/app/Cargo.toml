[workspace]
members = ["server"]

[package]
name = "sdlc-todo"
version = "0.2.0"
edition = "2021"
rust-version = "1.88"
resolver = "3"
description = "Tray app for the sdlc-kit personal to-do: a badge, notifications and the web board in a window"
license = "MIT"
publish = false

# A library with a mobile entry point and a thin desktop binary, as Tauri 2 lays an app out; only desktop is built.
[lib]
name = "sdlc_todo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "sdlc-todo"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.6", default-features = false }

[dependencies]
# Tauri 2.12 needs Rust 1.90; 2.11 is the newest line that builds with the kit's Rust 1.88.
tauri = { version = "~2.11.6", default-features = false, features = ["wry", "tray-icon", "dynamic-acl", "common-controls-v6", "custom-protocol"] }
tauri-plugin-single-instance = { version = "2.4", default-features = false }
notify-rust = "4"
ureq = { version = "2", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sdlc-todo-server = { path = "server" }

[target.'cfg(target_os = "macos")'.dependencies]
# Brings the Chrome ticket window forward (src/ticket.rs); already in the tree through tao.
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSRunningApplication", "libc"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
# The server keeps a panic inside its thread; it refuses to build with "abort".
panic = "unwind"
