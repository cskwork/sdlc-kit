name: selftest
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
env:
  # Git Bash otherwise copies on `ln -s`, and the symlink store checks would skip; ignored on macOS/Linux
  MSYS: winsymlinks:nativestrict
jobs:
  selftest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: git identity for the throwaway fixtures
        run: |
          git config --global user.email ci@sdlc-kit.invalid
          git config --global user.name "sdlc-kit CI"
          git config --global core.symlinks true
          git config --global core.autocrlf false
        shell: bash
      - name: no company names, domains or internal ticket keys in tracked files
        run: bash tests/public-trace.sh
        shell: bash
      - name: selftest
        run: bash tests/selftest.sh
        shell: bash
      - name: to-do server crate, and its list compared with core.mjs
        run: |
          cargo test --locked --release -p sdlc-todo-server --manifest-path todo/app/Cargo.toml
          cargo build --locked --release -p sdlc-todo-server --manifest-path todo/app/Cargo.toml
          SDLC_TODO_RUST_SERVE="$PWD/todo/app/target/release/sdlc-todo-serve" node --test tests/todo-rust.test.mjs
        shell: bash
  app:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: to-do app, tests and release build
        run: |
          cargo test --locked --release -p sdlc-todo --manifest-path todo/app/Cargo.toml
          cargo build --locked --release -p sdlc-todo --manifest-path todo/app/Cargo.toml
        shell: bash
