[package]
name = "sdlc-todo-server"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "The sdlc-kit to-do list and its local web API, without any window"
license = "MIT"
publish = false

# No window, tray or webview crate belongs here: every shell starts this library and talks HTTP to it.
[dependencies]
sha2 = { version = "0.10", default-features = false }
getrandom = "0.3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
